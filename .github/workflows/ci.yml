name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      CELERY_RESULT_BACKEND: rpc://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate
        run: python manage.py migrate
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=55
      - name: Coverage badge data
        id: coverage
        run: |
          coverage json -o coverage.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          totals = json.load(open("coverage.json"))["totals"]
          percent = totals["percent_covered"]
          color = "green" if percent >= 80 else "yellow" if percent >= 55 else "red"
          print(f"total={totals['percent_covered_display']}%")
          print(f"color={color}")
          PY
      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        continue-on-error: true
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 097e2cc0afbb6ee7fdbfb4d2d67bb87d
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total }}
          color: ${{ steps.coverage.outputs.color }}
